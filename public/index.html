<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>IPChat - Secure, Premium Real-Time Rooms</title>

    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2280%22>💬</text></svg>">

</head>
<body>

<div class="container">

    <h1>IPChat</h1>

    <!-- Glassmorphic Error Notification Card -->
    <div id="errorCard" class="error-card">
        <span id="errorText"></span>
    </div>

    <input
        type="text"
        id="usernameInput"
        placeholder="Enter Username"
        maxlength="20"
    >

    <input
        type="text"
        id="roomInput"
        placeholder="Enter Room ID"
        maxlength="20"
    >

    <button id="joinBtn">
        Join Room
    </button>

    
    <a class="instagram-credit" href="https://www.instagram.com/mohit_chawla_100" target="_blank" rel="noopener noreferrer" aria-label="Instagram: Mohit_chawla_100">
    <svg class="instagram-icon" viewBox="0 0 24 24" aria-hidden="true">
        <rect x="3" y="3" width="18" height="18" rx="5" ry="5"></rect>
        <circle cx="12" cy="12" r="4.2"></circle>
        <circle cx="17.4" cy="6.7" r="1.1" class="instagram-dot"></circle>
    </svg>
    <span>Mohit_chawla_100</span>
</a>
    <!-- Subtle Credit Footer -->
    <div class="footer-credit">Developed by Mohit</div>

</div>

<script src="js/index.js"></script>

</body>
</html>
